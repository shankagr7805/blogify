<head th:fragment="head"
      xmlns:th="http://www.thymeleaf.org">

    <!-- Basic -->
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>

    <!-- Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <!-- SEO Meta -->
    <title>Blogify - Modern Spring Boot Blogging Platform</title>
    <meta name="description"
          content="Blogify is a modern blogging platform built with Spring Boot, Spring Security, MySQL and Thymeleaf supporting authentication, image uploads and role-based access."/>
    <meta name="keywords"
          content="Blogify, Spring Boot Blog, Java Blog App, Thymeleaf Blog, Spring Security Project"/>
    <meta name="author" content="Shankar"/>

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" type="image/x-icon"/>

    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}"/>
    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}"/>

    <!-- Main Styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>

</head>
