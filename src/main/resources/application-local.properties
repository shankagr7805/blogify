# ── Local MySQL (Docker on 3308 to avoid conflicts) ───────────
SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3308/blogify_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
SPRING_DATASOURCE_USERNAME=root
SPRING_DATASOURCE_PASSWORD=root

# ── Override secret.properties values ────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3308/blogify_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ── Local Redis (Docker on 6381 to avoid conflicts) ───────────
spring.data.redis.host=localhost
spring.data.redis.port=6381

# ── Server ────────────────────────────────────────────────────
server.port=8080

# ── Disable email (not needed for testing) ────────────────────
SITE_DOMAIN=http://localhost:8080

# ── Cache logging ─────────────────────────────────────────────
logging.level.com.shank.Blogify.Controller=INFO

# ── Connection pool tuning ────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
